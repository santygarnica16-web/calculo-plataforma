<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Cálculo Integral · UTP</title>
<style>
:root{--bg:#f1f5f9;--surface:#ffffff;--primary:#1e3a8a;--primary-mid:#2563eb;--primary-light:#eff6ff;--text-main:#0f172a;--text-muted:#475569;--border:#cbd5e1;--badge-bg:#dbeafe;--badge-text:#1e40af;--radius:16px;--shadow:0 4px 14px rgba(15,23,42,0.06)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text-main);line-height:1.6;padding-bottom:50px}
.hero-header{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 100%);color:#fff;text-align:center;padding:38px 20px;margin-bottom:24px;box-shadow:var(--shadow);cursor:pointer}
.hero-header h1{font-size:23px;font-weight:800;margin-bottom:6px;letter-spacing:-0.3px}
.hero-header p{font-size:14px;opacity:0.92}
.container{max-width:860px;margin:0 auto;padding:0 16px}
.section-title{font-size:17px;font-weight:700;color:var(--text-main);margin-bottom:12px}
.search-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:14px;outline:none;margin-bottom:18px}
.search-input:focus{border-color:var(--primary-mid)}
.modules-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:transform .15s ease,border-color .15s ease}
.module-card:hover{transform:translateY(-3px);border-color:var(--primary-mid)}
.module-num{font-size:12.5px;font-weight:800;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.module-title{font-size:18px;font-weight:700;color:var(--text-main);margin-bottom:12px}
.badge-status{background:var(--badge-bg);color:var(--badge-text);font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-block}
#detail-view{display:none}
.detail-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);border:none;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:18px}
.formula-box{background:#f8fafc;border-left:4px solid var(--primary-mid);padding:14px 16px;border-radius:8px;font-family:"Courier New",monospace;font-size:14.5px;font-weight:700;color:var(--primary);margin:12px 0;overflow-x:auto}
.section-h3{font-size:16px;font-weight:700;margin:18px 0 8px;color:var(--text-main);border-bottom:1px solid #e2e8f0;padding-bottom:4px}
.lab-panel{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:18px}
.lab-header{font-size:15px;font-weight:800;color:var(--primary);margin-bottom:12px}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:14px}
.control-group label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.control-group select,.control-group input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13.5px;font-weight:600}
canvas{width:100%;height:280px;background:#fff;border:1px solid var(--border);border-radius:10px;display:block;margin:12px 0}
.result-banner{background:var(--primary);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:10px}
.dynamic-steps{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:12px;font-size:13.5px}
.dynamic-steps h4{font-size:13.5px;color:var(--primary);margin-bottom:8px}
.step-list{padding-left:20px;font-size:14px}
.step-list li{margin-bottom:6px}
footer{text-align:center;margin-top:34px;font-size:13px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="hero-header" onclick="showHome()">
  <h1>Plataforma de Cálculo Integral</h1>
  <p>Universidad Tecnológica de Pereira &middot; Sólidos de Revolución y Aplicaciones</p>
</div>
<main class="container">
  <div id="home-view">
    <div class="section-title">Módulos del Proyecto (Hasta Sólidos de Revolución)[span_0](start_span)[span_0](end_span)</div>
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar módulo (ej: Riemann, Discos, Arandelas, Capas, Partes)..." onkeyup="filterModules()">
    <div class="modules-list" id="modulesContainer"></div>
  </div>
  <div id="detail-view">
    <button class="back-btn" onclick="showHome()">&larr; Volver al Inicio</button>
    <div class="detail-box" id="detailContent"></div>
  </div>
  <footer>Universidad Tecnológica de Pereira &middot; Ingeniería &middot; Plataforma Interactiva</footer>
</main>
<script>
const modulesData=[
{id:1,num:"M1",title:"Sumas de Riemann",desc:"Aproximación del área bajo la curva como límite de particiones.",formula:"A = lim (n→∞) Σ [ f(x_i*) · Δx ]",theory:"Divide el intervalo [a, b] en n subintervalos de ancho Δx, construyendo rectángulos cuya suma converge a la integral definida.",labMode:"numeric",defaultMethod:"riemann-left"},
{id:2,num:"M2",title:"Regla del Trapecio",desc:"Aproximación mediante trapecios inscritos.",formula:"T_n = (Δx / 2) · [ f(x_0) + 2f(x_1) + ... + f(x_n) ]",theory:"Sustituye los techos horizontales por segmentos rectos que unen puntos consecutivos de la curva.",labMode:"numeric",defaultMethod:"trapezoid"},
{id:3,num:"M3",title:"Regla del Punto Medio",desc:"Rectángulos centrados en el punto medio de cada subintervalo.",formula:"M_n = Δx · Σ f( (x_{i-1} + x_i) / 2 )",theory:"Evalúa f(x) en el centro geométrico de cada partición para minimizar el error de aproximación.",labMode:"numeric",defaultMethod:"midpoint"},
{id:4,num:"M4",title:"Regla de Simpson",desc:"Ajuste cuadrático por arcos parabólicos (n par).",formula:"S_n = (Δx / 3) · [ f(x_0) + 4f(x_1) + 2f(x_2) + ... + f(x_n) ]",theory:"Interpola tríos consecutivos mediante parábolas, obteniendo resultados exactos para polinomios cúbicos.",labMode:"numeric",defaultMethod:"simpson"},
{id:5,num:"M5",title:"Integral Definida y Área",desc:"Teorema Fundamental del Cálculo y área entre curvas.",formula:"∫_a^b f(x) dx = F(b) - F(a)   |   A = ∫_a^b [ f(x) - g(x) ] dx",theory:"Conecta la derivación con la integración y calcula áreas exactas restando la función superior menos la inferior.",labMode:"area"},
{id:6,num:"M6",title:"Integración Directa",desc:"Linealidad y reglas inmediatas de antiderivadas.",formula:"∫ x^n dx = x^{n+1}/(n+1) + C  (n ≠ -1)",theory:"Busca la familia de primitivas F(x) + C cuya derivada reproduce el integrando f(x).",labMode:"symbolic",subType:"direct"},
{id:7,num:"M7",title:"Sustitución / Potencias",desc:"Cambio de variable u = g(x) y regla de la cadena inversa.",formula:"∫ f(g(x)) · g'(x) dx = ∫ f(u) du",theory:"Reduce integrales compuestas identificando una función interna y su respectivo diferencial.",labMode:"symbolic",subType:"subst"},
{id:8,num:"M8",title:"Integrales Exponenciales",desc:"Funciones con base e y bases arbitrarias.",formula:"∫ e^(a·x) dx = (1/a)e^(a·x) + C",theory:"La exponencial natural se mantiene invariable salvo el factor de escala de su exponente.",labMode:"symbolic",subType:"exp"},
{id:9,num:"M9",title:"Integrales Logarítmicas",desc:"Formas racionales que conducen al logaritmo natural.",formula:"∫ (f'(x) / f(x)) dx = ln|f(x)| + C",theory:"Resuelve el caso n = -1 cuando el numerador es proporcional a la derivada del denominador.",labMode:"symbolic",subType:"log"},
{id:10,num:"M10",title:"Integrales Trigonométricas",desc:"Potencias y productos de funciones trigonométricas.",formula:"∫ sen(x) dx = -cos(x) + C   |   ∫ cos(x) dx = sen(x) + C",theory:"Utiliza identidades pitagóricas y de ángulo medio para simplificar expresiones trigonométricas.",labMode:"symbolic",subType:"trig"},
{id:11,num:"M11",title:"Trigonométricas Inversas",desc:"Formas que generan arcsen y arctan.",formula:"∫ dx / (a² + x²) = (1/a) arctan(x/a) + C",theory:"Integra expresiones con denominadores cuadráticos irreducibles mediante funciones ciclométricas.",labMode:"symbolic",subType:"invtrig"},
{id:12,num:"M12",title:"Hiperbólicas Inversas",desc:"Integrales con radicales asociadas a arcsinh.",formula:"∫ dx / √(x² + a²) = arcsinh(x/a) + C",theory:"Alternativa logarítmica y compacta para radicales de suma o resta de cuadrados.",labMode:"symbolic",subType:"hyp"},
{id:13,num:"M13",title:"Trinomio ax² + bx + c",desc:"Completación de cuadrados en el denominador.",formula:"ax² + bx + c = a(x + b/2a)² + (c - b²/4a)",theory:"Reduce trinomios generales a formas canónicas u² ± a² para aplicar fórmulas directas.",labMode:"symbolic",subType:"trinom"},
{id:14,num:"M14",title:"Integración por Partes",desc:"Fórmula ∫u dv = uv - ∫v du y jerarquía LIATE.",formula:"∫ u dv = u · v - ∫ v du",theory:"Integra productos de funciones de distinta naturaleza priorizando Logarítmicas, Inversas, Algebraicas, Trigonométricas y Exponenciales.",labMode:"symbolic",subType:"parts"},
{id:15,num:"M15",title:"Sólidos de Revolución: Discos",desc:"Cálculo de volumen rotando una función alrededor del eje x.",formula:"V = π ∫_a^b [f(x)]² dx",theory:"Imagina el sólido rebanado en discos circulares infinitos de radio r = f(x) y espesor dx.",labMode:"solid-disk"},
{id:16,num:"M16",title:"Sólidos de Revolución: Arandelas",desc:"Volumen de sólidos huecos limitados por dos funciones f(x) y g(x).",formula:"V = π ∫_a^b ( [f(x)]² - [g(x)]² ) dx",theory:"Cada sección transversal es una arandela con radio exterior R(x) y radio interior r(x).",labMode:"solid-washer"},
{id:17,num:"M17",title:"Sólidos de Revolución: Capas",desc:"Volumen mediante cascarones cilíndricos concéntricos.",formula:"V = 2π ∫_a^b x · f(x) dx",theory:"Suma cilindros huecos delgados de altura f(x) y radio x alrededor de un eje vertical.",labMode:"solid-shell"}
];
  const container=document.getElementById("modulesContainer");
function renderModules(list){
  container.innerHTML="";
  list.forEach(mod=>{
    const card=document.createElement("div");
    card.className="module-card";
    card.onclick=()=>openModule(mod.id);
    card.innerHTML=`<div class="module-num">${mod.num}</div><h2 class="module-title">${mod.title}</h2><span class="badge-status">Simulador Activo</span>`;
    container.appendChild(card);
  });
}
function filterModules(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  renderModules(modulesData.filter(m=>m.title.toLowerCase().includes(q)||m.num.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q)));
}
function showHome(){
  document.getElementById("detail-view").style.display="none";
  document.getElementById("home-view").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function openModule(id){
  const mod=modulesData.find(m=>m.id===id);if(!mod)return;
  document.getElementById("home-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  let labHTML="";
  if(mod.labMode==="numeric"){
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Laboratorio de Cuadratura</div>
    <div class="controls-grid">
      <div class="control-group"><label>Función f(x)</label><select id="fnSel" onchange="runNumericLab()"><option value="x2">f(x) = x²</option><option value="x3">f(x) = 0.5x³ + 1</option><option value="sin">f(x) = 2·sen(x) + 2</option></select></div>
      <div class="control-group"><label>Método</label><select id="methSel" onchange="runNumericLab()"><option value="riemann-left" ${mod.defaultMethod==='riemann-left'?'selected':''}>Riemann Izquierda</option><option value="riemann-right">Riemann Derecha</option><option value="midpoint" ${mod.defaultMethod==='midpoint'?'selected':''}>Punto Medio</option><option value="trapezoid" ${mod.defaultMethod==='trapezoid'?'selected':''}>Trapecio</option><option value="simpson" ${mod.defaultMethod==='simpson'?'selected':''}>Simpson 1/3</option></select></div>
      <div class="control-group"><label>Límite a</label><input type="number" id="numA" value="0" step="0.5" onchange="runNumericLab()"></div>
      <div class="control-group"><label>Límite b</label><input type="number" id="numB" value="2" step="0.5" onchange="runNumericLab()"></div>
      <div class="control-group"><label>Particiones n: <span id="nLbl">6</span></label><input type="range" id="nRange" min="2" max="20" step="2" value="6" oninput="document.getElementById('nLbl').innerText=this.value;runNumericLab()"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Aproximación: <strong id="outApprox">0</strong></span><span>Exacta: <strong id="outExact">0</strong></span><span>Error: <strong id="outErr">0</strong></span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }else if(mod.labMode==="area"){
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Laboratorio de Área entre Curvas</div>
    <div class="controls-grid">
      <div class="control-group"><label>Altura k</label><input type="number" id="areaK" value="4" step="0.5" onchange="runAreaLab()"></div>
      <div class="control-group"><label>Límite a</label><input type="number" id="areaA" value="-1.41" step="0.1" onchange="runAreaLab()"></div>
      <div class="control-group"><label>Límite b</label><input type="number" id="areaB" value="1.41" step="0.1" onchange="runAreaLab()"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Área Total = <strong id="outArea">0</strong> u²</span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }else if(mod.labMode==="solid-disk"){
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Simulador Sólido de Revolución (Discos)</div>
    <div class="controls-grid">
      <div class="control-group"><label>Radio f(x)</label><select id="diskFn" onchange="runDiskLab()"><option value="sqrt">f(x) = √x</option><option value="linear">f(x) = 0.5x + 1</option><option value="parabola">f(x) = -0.25x² + 2</option></select></div>
      <div class="control-group"><label>Límite a</label><input type="number" id="diskA" value="0" step="0.5" onchange="runDiskLab()"></div>
      <div class="control-group"><label>Límite b</label><input type="number" id="diskB" value="4" step="0.5" onchange="runDiskLab()"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Volumen V = <strong id="outDiskVol">0</strong> π u³</span><span>V_total ≈ <strong id="outDiskReal">0</strong> u³</span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }else if(mod.labMode==="solid-washer"){
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Simulador Sólido de Revolución (Arandelas)</div>
    <div class="controls-grid">
      <div class="control-group"><label>Exterior R(x)</label><input type="text" value="√x" disabled style="background:#f1f5f9"></div>
      <div class="control-group"><label>Interior r(x)</label><input type="text" value="0.5x" disabled style="background:#f1f5f9"></div>
      <div class="control-group"><label>Límite b</label><input type="number" id="washB" value="2" step="0.5" onchange="runWasherLab()"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Volumen Arandelas V = <strong id="outWashVol">0</strong> u³</span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }else if(mod.labMode==="solid-shell"){
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Simulador Capas Cilíndricas (Shell)</div>
    <div class="controls-grid">
      <div class="control-group"><label>Función f(x)</label><select id="shellFn" onchange="runShellLab()"><option value="par">f(x) = 4 - x²</option><option value="cub">f(x) = x³</option></select></div>
      <div class="control-group"><label>Límite b</label><input type="number" id="shellB" value="2" step="0.5" onchange="runShellLab()"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Volumen por Capas V = <strong id="outShellVol">0</strong> u³</span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }else{
    labHTML=`<div class="lab-panel"><div class="lab-header">&#9881; Laboratorio Simbólico y Gráfico</div>
    <div class="controls-grid">
      <div class="control-group"><label>Parámetro a</label><input type="number" id="symA" value="2" step="1" onchange="runSymbolicLab('${mod.subType}')"></div>
      <div class="control-group"><label>Parámetro b</label><input type="number" id="symB" value="3" step="1" onchange="runSymbolicLab('${mod.subType}')"></div>
      <div class="control-group"><label>x₀</label><input type="number" id="symX0" value="0" step="0.5" onchange="runSymbolicLab('${mod.subType}')"></div>
      <div class="control-group"><label>x₁</label><input type="number" id="symX1" value="2" step="0.5" onchange="runSymbolicLab('${mod.subType}')"></div>
    </div>
    <canvas id="labCanvas" width="760" height="280"></canvas>
    <div class="result-banner"><span>Primitiva: <strong id="outPrim">F(x) + C</strong></span><span>Integral Definida: <strong id="outDef">0</strong></span></div>
    <div class="dynamic-steps" id="stepExplanation"></div></div>`;
  }
  document.getElementById("detailContent").innerHTML=`<div class="module-num">${mod.num}</div><h2 class="module-title" style="font-size:23px;">${mod.title}</h2><p style="font-size:14.5px;color:var(--text-muted);margin-bottom:10px;">${mod.desc}</p><h3 class="section-h3">Modelo Matemático</h3><div class="formula-box">${mod.formula}</div><h3 class="section-h3">Fundamento Teórico</h3><p style="font-size:14.5px;">${mod.theory}</p>${labHTML}`;
  setTimeout(()=>{
    if(mod.labMode==="numeric")runNumericLab();
    else if(mod.labMode==="area")runAreaLab();
    else if(mod.labMode==="solid-disk")runDiskLab();
    else if(mod.labMode==="solid-washer")runWasherLab();
    else if(mod.labMode==="solid-shell")runShellLab();
    else runSymbolicLab(mod.subType);
  },30);
  window.scrollTo({top:0,behavior:"smooth"});
}
  function fNum(t,x){return t==="x2"?x*x:t==="x3"?0.5*Math.pow(x,3)+1:2*Math.sin(x)+2;}
function FNum(t,x){return t==="x2"?Math.pow(x,3)/3:t==="x3"?0.125*Math.pow(x,4)+x:-2*Math.cos(x)+2*x;}
function runNumericLab(){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const fn=document.getElementById("fnSel").value,m=document.getElementById("methSel").value;
  let a=parseFloat(document.getElementById("numA").value)||0,b=parseFloat(document.getElementById("numB").value)||2;
  if(b<=a)b=a+1;const n=parseInt(document.getElementById("nRange").value,10),dx=(b-a)/n;
  ctx.clearRect(0,0,c.width,c.height);
  let maxY=4;const padL=45,padR=20,padT=20,padB=30,W=c.width-padL-padR,H=c.height-padT-padB;
  const toX=x=>padL+((x-a)/(b-a))*W,toY=y=>padT+H-(y/maxY)*H;
  ctx.strokeStyle="#94a3b8";ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+H);ctx.lineTo(padL+W,padT+H);ctx.stroke();
  let approx=0;ctx.fillStyle="rgba(37,99,235,0.22)";ctx.strokeStyle="#1e3a8a";ctx.lineWidth=1.5;
  for(let i=0;i<n;i++){
    const x0=a+i*dx,x1=x0+dx,sx=m==='riemann-right'?x1:m==='midpoint'?(x0+x1)/2:x0,h=fNum(fn,sx);
    approx+=h*dx;ctx.fillRect(toX(x0),toY(h),toX(x1)-toX(x0),toY(0)-toY(h));ctx.strokeRect(toX(x0),toY(h),toX(x1)-toX(x0),toY(0)-toY(h));
  }
  ctx.strokeStyle="#d97706";ctx.lineWidth=2.5;ctx.beginPath();for(let px=0;px<=200;px++){const x=a+(px/200)*(b-a),y=fNum(fn,x);px===0?ctx.moveTo(toX(x),toY(y)):ctx.lineTo(toX(x),toY(y));}ctx.stroke();
  const exact=FNum(fn,b)-FNum(fn,a);
  document.getElementById("outApprox").innerText=approx.toFixed(4);
  document.getElementById("outExact").innerText=exact.toFixed(4);
  document.getElementById("outErr").innerText=Math.abs(exact-approx).toFixed(4);
  document.getElementById("stepExplanation").innerHTML=`<h4>Explicación del Método Numérico</h4><ol class="step-list"><li>Ancho Δx = ${dx.toFixed(3)}.</li><li>Aproximación = <strong>${approx.toFixed(4)}</strong> frente a la exacta = <strong>${exact.toFixed(4)}</strong>.</li></ol>`;
}
function runAreaLab(){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const k=parseFloat(document.getElementById("areaK").value)||4;
  const a=parseFloat(document.getElementById("areaA").value)||-1.41,b=parseFloat(document.getElementById("areaB").value)||1.41;
  ctx.clearRect(0,0,c.width,c.height);const toX=x=>c.width/2+x*110,toY=y=>c.height-25-y*(210/(k+1));
  ctx.fillStyle="rgba(37,99,235,0.25)";ctx.beginPath();
  for(let i=0;i<=100;i++){const x=a+(i/100)*(b-a);i===0?ctx.moveTo(toX(x),toY(k-x*x)):ctx.lineTo(toX(x),toY(k-x*x));}
  for(let i=100;i>=0;i--){const x=a+(i/100)*(b-a);ctx.lineTo(toX(x),toY(x*x));}
  ctx.closePath();ctx.fill();
  const F=x=>k*x-(2/3)*Math.pow(x,3),area=Math.abs(F(b)-F(a));
  document.getElementById("outArea").innerText=area.toFixed(4);
  document.getElementById("stepExplanation").innerHTML=`<h4>Cálculo de Área</h4><ol class="step-list"><li>A = ∫ [(${k}-x²) - x²] dx.</li><li>Resultado analítico = <strong>${area.toFixed(4)} u²</strong>.</li></ol>`;
}
function runDiskLab(){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const type=document.getElementById("diskFn").value;
  const a=parseFloat(document.getElementById("diskA").value)||0,b=parseFloat(document.getElementById("diskB").value)||4;
  ctx.clearRect(0,0,c.width,c.height);
  const W=c.width,H=c.height,toX=x=>40+x*(W-80)/b,toY=y=>H/2-y*30;
  ctx.strokeStyle="#cbd5e1";ctx.beginPath();ctx.moveTo(40,H/2);ctx.lineTo(W-40,H/2);ctx.stroke();
  let volInt=type==="sqrt"?Math.PI*(Math.pow(b,2)/2):type==="linear"?Math.PI*(Math.pow(b,3)/3+b*b+b):Math.PI*((1/16)*(Math.pow(b,5)/5)-(1/2)*(Math.pow(b,3)/3)+4*b);
  ctx.fillStyle="rgba(37,99,235,0.3)";ctx.strokeStyle="#1e3a8a";ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const rx=a+i*((b-a)/6),r=type==="sqrt"?Math.sqrt(rx):type==="linear"?0.5*rx+1:-0.25*rx*rx+2;
    ctx.fillRect(toX(rx),toY(r),12,r*60);ctx.strokeRect(toX(rx),toY(r),12,r*60);
  }
  document.getElementById("outDiskVol").innerText=(volInt/Math.PI).toFixed(3);
  document.getElementById("outDiskReal").innerText=volInt.toFixed(2);
  document.getElementById("stepExplanation").innerHTML=`<h4>Método de Discos (Eje X)</h4><ol class="step-list"><li>Fórmula: <strong>V = π ∫ [f(x)]² dx</strong>.</li><li>Volumen calculado en [${a}, ${b}] = <strong>${volInt.toFixed(2)} u³</strong>.</li></ol>`;
}
function runWasherLab(){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const b=parseFloat(document.getElementById("washB").value)||2;
  ctx.clearRect(0,0,c.width,c.height);const W=c.width,H=c.height;
  ctx.strokeStyle="#cbd5e1";ctx.beginPath();ctx.moveTo(40,H/2);ctx.lineTo(W-40,H/2);ctx.stroke();
  const vol=Math.PI*((b*b)/2-Math.pow(b,3)/12);
  ctx.fillStyle="rgba(217,119,6,0.3)";ctx.fillRect(80,H/2-70,200,140);
  document.getElementById("outWashVol").innerText=vol.toFixed(3);
  document.getElementById("stepExplanation").innerHTML=`<h4>Método de Arandelas</h4><ol class="step-list"><li>Fórmula: <strong>V = π ∫ ( [R(x)]² - [r(x)]² ) dx</strong>.</li><li>Volumen con hueco central = <strong>${vol.toFixed(3)} u³</strong>.</li></ol>`;
}
function runShellLab(){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const fn=document.getElementById("shellFn").value;
  const b=parseFloat(document.getElementById("shellB").value)||2;
  ctx.clearRect(0,0,c.width,c.height);
  const W=c.width,H=c.height;
  const padL=45,padR=20,padT=20,padB=30,graphW=W-padL-padR,graphH=H-padT-padB;
  const maxY=fn==="par"?5:Math.max(8,Math.pow(b,3)*1.2);
  const toX=x=>padL+(x/b)*graphW;
  const toY=y=>padT+graphH-(y/maxY)*graphH;
  ctx.strokeStyle="#cbd5e1";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,toY(0));ctx.lineTo(W-padR,toY(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+graphH);ctx.stroke();
  const n=6,dx=b/n;
  ctx.fillStyle="rgba(37,99,235,0.25)";ctx.strokeStyle="#1e3a8a";ctx.lineWidth=1.5;
  for(let i=0;i<n;i++){
    const x=(i+0.5)*dx;
    const h=fn==="par"?4-x*x:Math.pow(x,3);
    if(h>0){
      const xPos=toX(x);
      ctx.fillRect(xPos-5,toY(h),10,toY(0)-toY(h));
      ctx.strokeRect(xPos-5,toY(h),10,toY(0)-toY(h));
    }
  }
  ctx.strokeStyle="#d97706";ctx.lineWidth=2.5;ctx.beginPath();
  for(let px=0;px<=100;px++){
    const x=(px/100)*b;
    const y=fn==="par"?4-x*x:Math.pow(x,3);
    px===0?ctx.moveTo(toX(x),toY(y)):ctx.lineTo(toX(x),toY(y));
  }
  ctx.stroke();
  const vol=fn==="par"?2*Math.PI*(2*b*b-Math.pow(b,4)/4):2*Math.PI*(Math.pow(b,5)/5);
  document.getElementById("outShellVol").innerText=isFinite(vol)?vol.toFixed(3):"0";
  document.getElementById("stepExplanation").innerHTML=`<h4>Método de Capas Cilíndricas (Shell)</h4><ol class="step-list"><li>Fórmula: <strong>V = 2π ∫ x · f(x) dx</strong>.</li><li>Función: f(x) = ${fn==="par"?"4 - x²":"x³"} en [0, ${b}].</li><li>Volumen por cascarones = <strong>${isFinite(vol)?vol.toFixed(3):0} u³</strong>.</li></ol>`;
}
function runSymbolicLab(type){
  const c=document.getElementById("labCanvas");if(!c)return;const ctx=c.getContext("2d");
  const a=parseFloat(document.getElementById("symA").value)||2,b=parseFloat(document.getElementById("symB").value)||3;
  const x0=parseFloat(document.getElementById("symX0").value)||0,x1=parseFloat(document.getElementById("symX1").value)||2;
  ctx.clearRect(0,0,c.width,c.height);
  const f=x=>a*Math.pow(x,b),F=x=>(a/(b+1))*Math.pow(x,b+1);
  const minX=Math.min(x0,x1)-1,maxX=Math.max(x0,x1)+1;
  let minY=0,maxY=1;
  for(let i=0;i<=50;i++){const x=minX+(i/50)*(maxX-minX),y1=f(x),y2=F(x);if(isFinite(y1)){minY=Math.min(minY,y1);maxY=Math.max(maxY,y1);}if(isFinite(y2)){minY=Math.min(minY,y2);maxY=Math.max(maxY,y2);}}
  const padL=45,padR=20,padT=20,padB=25,W=c.width-padL-padR,H=c.height-padT-padB;
  const toX=x=>padL+((x-minX)/(maxX-minX))*W,toY=y=>padT+H-((y-minY)/(maxY-minY+0.01))*H;
  ctx.strokeStyle="#cbd5e1";ctx.beginPath();ctx.moveTo(padL,toY(0));ctx.lineTo(padL+W,toY(0));ctx.stroke();
  ctx.fillStyle="rgba(30,58,138,0.18)";ctx.beginPath();ctx.moveTo(toX(x0),toY(0));
  for(let i=0;i<=50;i++){const x=x0+(i/50)*(x1-x0);ctx.lineTo(toX(x),toY(f(x)));}
  ctx.lineTo(toX(x1),toY(0));ctx.closePath();ctx.fill();
  ctx.strokeStyle="#1e3a8a";ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=100;i++){const x=minX+(i/100)*(maxX-minX),y=f(x);i===0?ctx.moveTo(toX(x),toY(y)):ctx.lineTo(toX(x),toY(y));}ctx.stroke();
  ctx.strokeStyle="#059669";ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=100;i++){const x=minX+(i/100)*(maxX-minX),y=F(x);i===0?ctx.moveTo(toX(x),toY(y)):ctx.lineTo(toX(x),toY(y));}ctx.stroke();
  const defVal=F(x1)-F(x0);
  document.getElementById("outPrim").innerText=`(${a}/${b+1})x^${b+1} + C`;
  document.getElementById("outDef").innerText=isFinite(defVal)?defVal.toFixed(4):"N/A";
  document.getElementById("stepExplanation").innerHTML=`<h4>Desarrollo Simbólico y TFC</h4><ol class="step-list"><li>Primitiva general: F(x) = (${a}/${b+1})x^${b+1} + C.</li><li>Evaluación en [${x0}, ${x1}]: F(${x1}) - F(${x0}) = <strong>${isFinite(defVal)?defVal.toFixed(4):"N/A"}</strong>.</li></ol>`;
}
