<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cálculo Integral · Universidad Tecnológica de Pereira</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --primary: #0f4c5c;
      --primary-light: #e6f0f2;
      --accent: #1b6b7d;
      --text-main: #1a202c;
      --text-muted: #5a6778;
      --border: #e2e8f0;
      --badge-bg: #e6f4ea;
      --badge-text: #137333;
      --tag-bg: #edf2f7;
      --tag-text: #4a5568;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.55;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .btn-outline {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: var(--tag-bg);
    }

    /* Container */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Filter Bar */
    .search-bar {
      margin-bottom: 18px;
      display: flex;
      gap: 10px;
    }
